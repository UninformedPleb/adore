name: nugetify

on:
  release:
    types: [created]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8
    - name: Build and pack ADORE
      run: |
        cd ./ADORE
        dotnet pack -c Release --o ../
    - name: Build and pack ADORE.Configuration
      run: |
        cd ./ADORE.Configuration
        dotnet pack -c Release --o ../
    - name: Push to nuget
      run: dotnet nuget push "*.nupkg" --skip-duplicate --api-key ${{secrets.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
